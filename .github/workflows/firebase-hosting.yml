# Pubblica il sito su Firebase Hosting (https://db-operativo.web.app)
# a ogni push su main, oppure a mano da Actions → "Deploy Firebase Hosting" → Run workflow.
# Richiede il secret FIREBASE_SERVICE_ACCOUNT (JSON della chiave dell'account di servizio).
name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: db-operativo
